{% extends 'base.html' %}
{% block content %}
<div class="flex flex-col items-center justify-center min-h-[75vh] px-4 animate-fade-in">
    
    <div class="glass-panel max-w-lg w-full p-10 md:p-14 text-center relative overflow-hidden shadow-xl border-t-4 border-t-amber-500">
        
        <div class="absolute -top-10 -right-10 text-[12rem] font-black text-amber-500/5 pointer-events-none select-none leading-none">500</div>
        
        <div class="relative z-10">
            <div class="w-20 h-20 bg-amber-50 rounded-full flex items-center justify-center text-4xl mb-6 shadow-sm border border-amber-100 mx-auto text-amber-500">
                <i class="fas fa-tools"></i>
            </div>
            
            <h1 class="text-3xl font-black text-slate-800 mb-2 tracking-tight">Falha no Motor</h1>
            <h2 class="text-sm font-bold text-amber-600 mb-6 uppercase tracking-widest">Erro 500 - Server Error</h2>
            
            <p class="text-sm text-slate-500 mb-10 font-medium leading-relaxed bg-white/60 p-5 rounded-2xl border border-slate-100 shadow-inner">
                Problema técnico detetado! Tivemos uma falha inesperada nos bastidores da aplicação. O nosso sistema já registou o problema.
            </p>
            
            <button onclick="window.location.reload();" class="w-full btn-primary !bg-amber-500 hover:!bg-amber-600 !shadow-amber-500/30 py-4 text-base mb-4 flex items-center justify-center gap-2">
                <i class="fas fa-sync-alt"></i> Tentar Novamente
            </button>
            <a href="/" class="text-xs font-bold text-slate-400 hover:text-slate-600 transition uppercase tracking-widest underline">Forçar Volta ao Início</a>
        </div>
    </div>
    
</div>
{% endblock %}
