{% extends 'base.html' %}
{% block content %}
<div class="flex flex-col items-center justify-center min-h-[75vh] px-4 animate-fade-in">
    
    <div class="glass-panel max-w-lg w-full p-10 md:p-14 text-center relative overflow-hidden shadow-xl">
        <div class="absolute -top-10 -right-10 text-[15rem] font-black text-slate-100 opacity-50 pointer-events-none select-none leading-none">404</div>
        
        <div class="relative z-10">
            <div class="w-24 h-24 bg-white rounded-3xl flex items-center justify-center text-5xl mb-6 shadow-sm border border-slate-100 mx-auto text-slate-300 transform -rotate-6">
                <i class="fas fa-map-signs text-brand"></i>
            </div>
            
            <h1 class="text-4xl font-black text-slate-800 mb-2 tracking-tight">Rota Perdida</h1>
            <h2 class="text-lg font-bold text-slate-500 mb-6 uppercase tracking-widest">Erro 404 - Posto não localizado</h2>
            
            <p class="text-sm text-slate-500 mb-10 font-medium leading-relaxed bg-white/50 p-4 rounded-xl border border-slate-100">
                Ops! Parece que se perdeu na ronda. A página que tentou aceder não existe, foi movida de lugar ou você não tem permissão para a visualizar.
            </p>
            
            <a href="/" class="btn-primary w-full py-4 text-base flex justify-center items-center gap-2">
                <i class="fas fa-home"></i> Voltar à Base (Início)
            </a>
        </div>
    </div>
    
</div>
{% endblock %}
