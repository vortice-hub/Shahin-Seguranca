<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortice - Control Plane Authentication</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .bg-grid {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-300 min-h-screen flex items-center justify-center bg-grid p-4 relative overflow-hidden">

    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-indigo-600/20 rounded-full blur-[120px] pointer-events-none"></div>

    <div class="w-full max-w-md relative z-10">
        
        <div class="text-center mb-10">
            <div class="w-20 h-20 mx-auto bg-gradient-to-br from-indigo-500 to-purple-700 rounded-[2rem] flex items-center justify-center shadow-2xl shadow-indigo-500/30 mb-6 transform rotate-3">
                <i class="fas fa-network-wired text-4xl text-white -rotate-3"></i>
            </div>
            <h1 class="text-3xl font-black text-white tracking-tight">Vortice SaaS</h1>
            <p class="text-indigo-400 font-mono text-xs mt-2 uppercase tracking-widest font-bold">Global Control Plane</p>
        </div>

        <div class="bg-slate-900/90 backdrop-blur-xl rounded-[2rem] p-8 md:p-10 shadow-2xl border border-slate-800">
            
            <div class="flex items-center gap-3 mb-8 pb-4 border-b border-slate-800/50">
                <div class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></div>
                <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Acesso Restrito</span>
            </div>

            <form action="{{ url_for('super_admin.login') }}" method="POST" class="space-y-6">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Chave de Identificação (CPF)</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fas fa-fingerprint text-slate-500"></i>
                        </div>
                        <input type="text" name="cpf" required autocomplete="off"
                            class="w-full pl-11 pr-4 py-3.5 bg-slate-950/50 border border-slate-800 rounded-xl text-white font-mono placeholder-slate-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition shadow-inner"
                            placeholder="000.000.000-00">
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Palavra-passe de Comando</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fas fa-lock text-slate-500"></i>
                        </div>
                        <input type="password" name="senha" required 
                            class="w-full pl-11 pr-4 py-3.5 bg-slate-950/50 border border-slate-800 rounded-xl text-white font-mono placeholder-slate-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition shadow-inner"
                            placeholder="••••••••">
                    </div>
                </div>

                <button type="submit" class="w-full py-4 bg-indigo-600 hover:bg-indigo-500 text-white font-black rounded-xl shadow-lg shadow-indigo-600/30 transition-all transform active:scale-95 tracking-wide mt-4 flex items-center justify-center gap-2">
                    <i class="fas fa-terminal opacity-70"></i> INICIAR SESSÃO
                </button>
            </form>
        </div>
        
        <div class="text-center mt-8 text-slate-600 text-[9px] font-mono uppercase tracking-widest font-bold">
            Protocolo de Segurança Ativo &bull; IP Registado
        </div>

    </div>

    <div id="flash-messages" class="hidden">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div data-category="{{ category }}" data-message="{{ message }}"></div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const flashContainer = document.getElementById('flash-messages');
            const messages = flashContainer.querySelectorAll('div');
            
            messages.forEach(msg => {
                const category = msg.getAttribute('data-category');
                const text = msg.getAttribute('data-message');
                
                let bgColor = "linear-gradient(to right, #4f46e5, #4338ca)";
                if (category === 'error') bgColor = "linear-gradient(to right, #e11d48, #be123c)"; 
                else if (category === 'success') bgColor = "linear-gradient(to right, #10b981, #059669)";

                Toastify({
                    text: text, duration: 4000, close: true, gravity: "top", position: "center",
                    style: { background: bgColor, borderRadius: "12px", fontFamily: "'Inter', sans-serif", fontSize: "14px", fontWeight: "600", boxShadow: "0 10px 15px -3px rgba(0, 0, 0, 0.5)" }
                }).showToast();
            });
        });
    </script>
</body>
</html>
