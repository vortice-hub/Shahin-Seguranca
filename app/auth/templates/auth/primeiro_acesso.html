{% extends 'base.html' %}
{% block content %}
<div class="min-h-[85vh] flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-[420px] mb-6 text-center animate-fade-in">
        <div class="w-16 h-16 bg-white rounded-2xl shadow-sm border border-slate-100 flex items-center justify-center mx-auto mb-4 text-yellow-500">
            <i class="fas fa-shield-alt text-2xl"></i>
        </div>
        <h1 class="text-2xl font-black text-slate-800 tracking-tight">Primeiro Acesso</h1>
        <p class="text-slate-500 font-medium mt-2 text-sm px-4">Por segurança, você deve definir uma nova senha pessoal e intransferível.</p>
    </div>

    <div class="glass-panel w-full max-w-[420px] p-8 sm:p-10 animate-fade-in relative overflow-hidden" style="animation-delay: 0.1s; animation-fill-mode: both;">
        <div class="absolute top-0 left-0 right-0 h-1.5 bg-yellow-400"></div>
        
        <form action="/primeiro-acesso" method="POST" class="space-y-6 pt-2">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            
            <div>
                <label class="label-pro">Nova Senha</label>
                <div class="relative">
                    <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="password" name="nova_senha" id="nova_senha" class="input-pro pl-12 pr-10 text-lg tracking-widest" placeholder="••••••••" required>
                    <button type="button" onclick="togglePassword('nova_senha', 'eye_nova')" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-yellow-500 focus:outline-none transition">
                        <i class="fas fa-eye" id="eye_nova"></i>
                    </button>
                </div>
            </div>
            
            <div>
                <label class="label-pro">Confirmar Senha</label>
                <div class="relative">
                    <i class="fas fa-check-circle absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="password" name="confirmacao" id="confirmacao" class="input-pro pl-12 pr-10 text-lg tracking-widest" placeholder="••••••••" required>
                    <button type="button" onclick="togglePassword('confirmacao', 'eye_conf')" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-yellow-500 focus:outline-none transition">
                        <i class="fas fa-eye" id="eye_conf"></i>
                    </button>
                </div>
            </div>
            
            <button type="submit" class="w-full btn-primary py-4 text-base mt-2 !bg-yellow-500 hover:!bg-yellow-600 !shadow-yellow-500/30">
                Salvar e Acessar
            </button>
        </form>
    </div>
</div>

<script>
    function togglePassword(inputId, iconId) {
        const input = document.getElementById(inputId);
        const icon = document.getElementById(iconId);
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }
</script>
{% endblock %}
