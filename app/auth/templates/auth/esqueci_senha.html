{% extends 'base.html' %}
{% block content %}
<div class="min-h-[85vh] flex flex-col items-center justify-center p-4">
    
    <div class="w-full max-w-[420px] mb-6 text-center animate-fade-in">
        <div class="w-16 h-16 bg-white rounded-2xl shadow-sm border border-slate-100 flex items-center justify-center mx-auto mb-4 text-brand">
            <i class="fas fa-unlock-alt text-2xl"></i>
        </div>
        <h1 class="text-2xl font-black text-slate-800 tracking-tight">Recuperar Acesso</h1>
        <p class="text-slate-500 font-medium mt-2 text-sm px-4">Valide suas informações contratuais para gerar uma nova senha temporária.</p>
    </div>

    <div class="glass-panel w-full max-w-[420px] p-8 sm:p-10 animate-fade-in" style="animation-delay: 0.1s; animation-fill-mode: both;">
        <form action="/esqueci-senha" method="POST" class="space-y-6">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            
            <div>
                <label class="label-pro">CPF (Somente Números)</label>
                <div class="relative">
                    <i class="fas fa-id-card absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" name="cpf" class="input-pro pl-12 font-mono text-lg tracking-wider" placeholder="000.000.000-00" required>
                </div>
            </div>

            <div>
                <label class="label-pro flex justify-between items-end">
                    <span>Data de Admissão</span>
                    <span class="text-[9px] text-slate-400 normal-case font-normal">*Início do contrato</span>
                </label>
                <div class="relative">
                    <i class="fas fa-calendar-alt absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="date" name="data_admissao" class="input-pro pl-12 text-slate-700 font-medium" required>
                </div>
            </div>

            <button type="submit" class="w-full btn-primary py-4 text-base mt-2">
                Validar e Gerar Senha
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-slate-100 text-center">
            <a href="/login" class="inline-flex items-center gap-2 text-sm text-slate-500 hover:text-slate-800 font-bold transition group">
                <i class="fas fa-arrow-left group-hover:-translate-x-1 transition-transform"></i> Voltar ao Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
