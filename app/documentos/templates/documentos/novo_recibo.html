{% extends 'base.html' %}
{% block content %}
<link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>

<style>
    /* Adaptação do TomSelect ao novo Design System Glassmorphism */
    .ts-dropdown {
        z-index: 1000 !important;
        border-radius: 0 0 1rem 1rem;
        box-shadow: 0 15px 50px -10px rgba(0, 0, 0, 0.1);
        border-color: rgba(226, 232, 240, 0.8);
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
    }
    .ts-control {
        border-radius: 1rem;
        padding: 0.85rem 1.2rem;
        font-size: 0.875rem;
        font-weight: 600;
        border-color: rgba(226, 232, 240, 0.8);
        background-color: #f8fafc;
        box-shadow: none;
    }
    .ts-control.focus {
        border-color: color-mix(in srgb, var(--primary-color) 40%, transparent);
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary-color) 10%, transparent);
        background-color: #ffffff;
    }
</style>

<div class="max-w-3xl mx-auto animate-fade-in">
    <div class="flex items-center justify-between mb-8">
        <div>
            <h2 class="text-3xl font-black text-slate-800 tracking-tight">Gerar Recibo Avulso</h2>
            <p class="text-sm text-slate-500 font-medium mt-1">Crie recibos digitais instantâneos para assinatura.</p>
        </div>
        <a href="/documentos/admin" class="btn-glass text-xs">
            <i class="fas fa-times mr-1"></i> Cancelar
        </a>
    </div>

    <div class="glass-panel overflow-hidden shadow-lg animate-fade-in" style="animation-delay: 0.1s; animation-fill-mode: both;">
        <div class="bg-slate-800 border-b border-slate-700 p-6 text-center relative overflow-hidden">
            <div class="absolute -right-6 -top-6 text-white/5"><i class="fas fa-receipt text-8xl"></i></div>
            <h3 class="font-black text-lg text-white tracking-widest uppercase relative z-10">Recibo de Pagamento</h3>
        </div>

        <form action="/documentos/admin/recibo/novo" method="POST" enctype="multipart/form-data" class="p-8 md:p-10 space-y-8 bg-white/50">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

            <div>
                <label class="label-pro flex items-center gap-2"><i class="fas fa-user-tag text-brand"></i> Selecione o Funcionário</label>
                <select name="user_id" id="userSelect" class="w-full" placeholder="Clique e digite o nome..." autocomplete="off" required>
                    <option value="">Procurar funcionário...</option>
                    {% for u in usuarios %}
                    <option value="{{ u.id }}">{{ u.real_name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="bg-yellow-50 p-5 rounded-2xl border border-yellow-100 shadow-inner">
                <p class="text-xs font-serif text-slate-600 italic leading-relaxed text-center">
                    "Recebi de <strong id="previewEmpresa" class="text-yellow-800 font-bold border-b border-yellow-200 pb-0.5">...</strong>, inscrita no CNPJ <strong id="previewCnpj" class="text-yellow-800 font-mono">...</strong> a quantia abaixo especificada..."
                </p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="label-pro text-emerald-600">Valor Líquido (R$)</label>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 font-black text-emerald-600">R$</span>
                        <input type="number" step="0.01" name="valor" class="input-pro pl-12 text-2xl font-black text-emerald-700 !py-4 bg-emerald-50/30 border-emerald-100 focus:border-emerald-500 focus:ring-emerald-500" placeholder="0.00" required>
                    </div>
                </div>
                <div>
                    <label class="label-pro">Data de Referência/Pagamento</label>
                    <div class="relative">
                        <i class="far fa-calendar-alt absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="date" name="data_pagamento" class="input-pro pl-12 text-slate-700 font-medium !py-4" required>
                    </div>
                </div>
            </div>

            <div>
                <label class="label-pro">Arquivo do Recibo (PDF)</label>
                <div class="relative">
                    <input type="file" name="arquivo_pdf" accept="application/pdf" class="w-full p-3 bg-white border border-slate-200 rounded-xl text-xs shadow-sm" required>
                </div>
            </div>

            <div class="pt-4">
                <button type="submit" class="w-full btn-primary py-5 text-lg shadow-xl shadow-brand/20">
                    <i class="fas fa-file-signature mr-2"></i> ENVIAR RECIBO PARA ASSINATURA
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    new TomSelect("#userSelect", {
        create: false,
        maxOptions: 100, 
        sortField: {
            field: "text",
            direction: "asc"
        },
        render: {
            no_results: function(data, escape) {
                return '<div class="no-results text-slate-400 p-3 text-sm font-medium">Nenhum funcionário encontrado...</div>';
            }
        },
        onChange: function(value) {
            if(value) carregarDadosUser(value);
        }
    });

    function carregarDadosUser(userId) {
        if(!userId) return;
        fetch(`/documentos/api/user-info/${userId}`)
            .then(response => response.json())
            .then(data => {
                document.getElementById('previewEmpresa').innerText = data.razao_social || "EMPRESA PADRÃO";
                document.getElementById('previewCnpj').innerText = data.cnpj || "00.000.000/0000-00";
            })
            .catch(err => console.error("Erro ao buscar dados:", err));
    }
</script>
{% endblock %}
