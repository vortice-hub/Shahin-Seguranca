{% extends 'base.html' %}
{% block content %}
<div class="max-w-2xl mx-auto animate-fade-in">
    <div class="flex items-center justify-between mb-8">
        <div>
            <h2 class="text-3xl font-black text-slate-800 tracking-tight">Nova Entrada</h2>
            <p class="text-sm text-slate-500 font-medium mt-1">Adicione itens pré-definidos ou crie novos no inventário.</p>
        </div>
        <a href="{{ url_for('estoque.controle_uniforme') }}" class="btn-glass text-xs">
            <i class="fas fa-arrow-left mr-1"></i> Voltar
        </a>
    </div>

    <div class="glass-panel overflow-hidden shadow-md mb-8">
        <div class="bg-emerald-50/50 border-b border-emerald-100/50 p-6 flex items-center gap-4">
            <div class="w-12 h-12 bg-white border border-emerald-100 text-emerald-500 rounded-2xl flex items-center justify-center text-xl shadow-sm">
                <i class="fas fa-box-open"></i>
            </div>
            <div>
                <h3 class="font-black text-emerald-800 text-lg tracking-tight">Registar Material</h3>
                <p class="text-xs text-emerald-600/70 font-bold uppercase tracking-widest mt-0.5">Entrada de Fornecedor</p>
            </div>
        </div>

        <form action="/entrada" method="POST" class="p-8 space-y-6 bg-white/50">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            
            <div>
                <label class="label-pro">Item / Uniforme</label>
                <select name="nome_select" id="nome_select" class="input-pro cursor-pointer font-bold text-slate-700" onchange="verificarOutros(this)">
                    <option value="Camisa Tático">Camisa Tático</option>
                    <option value="Calça Tático">Calça Tático</option>
                    <option value="Camisa Portaria">Camisa Portaria</option>
                    <option value="Calça Portaria">Calça Portaria</option>
                    <option value="Blazer Portaria">Blazer Portaria</option>
                    <option value="Camisa Limpeza">Camisa Limpeza</option>
                    <option value="Calça Limpeza">Calça Limpeza</option>
                    <option value="Outros">Outros (Digitar manualmente)...</option>
                </select>
            </div>
            
            <div id="div_outros" class="hidden animate-fade-in bg-brand/5 p-4 rounded-xl border border-brand/20">
                <label class="label-pro text-brand">Digite o nome do Novo Item</label>
                <input type="text" name="nome_outros" id="nome_outros" class="input-pro border-brand/30 focus:border-brand bg-white" placeholder="Ex: Sapato Social">
            </div>
            
            <div class="grid grid-cols-2 gap-5">
                <div>
                    <label class="label-pro">Tamanho</label>
                    <select name="tamanho" class="input-pro cursor-pointer">
                        <option value="P">P</option><option value="M">M</option><option value="G">G</option><option value="GG">GG</option><option value="XG">XG</option>
                    </select>
                </div>
                <div>
                    <label class="label-pro">Gênero</label>
                    <select name="genero" class="input-pro cursor-pointer">
                        <option value="Masculino">Masculino</option><option value="Feminino">Feminino</option><option value="Unissex">Unissex</option>
                    </select>
                </div>
            </div>
            
            <div class="bg-emerald-50/50 p-5 rounded-2xl border border-emerald-100/50">
                <label class="label-pro text-emerald-700">Quantidade Recebida</label>
                <input type="number" name="quantidade" min="1" value="1" class="input-pro font-black text-2xl text-emerald-700 border-emerald-200 focus:border-emerald-500 focus:ring-emerald-500 bg-white !py-4 text-center" required>
            </div>
            
            <div class="pt-6 border-t border-slate-200/60">
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Definição de Níveis (Opcional)</p>
                <div class="grid grid-cols-2 gap-5">
                    <div>
                        <label class="label-pro text-red-500">Mínimo (Alerta)</label>
                        <input type="number" name="estoque_minimo" value="5" class="input-pro border-red-100 focus:border-red-400 font-bold text-red-600">
                    </div>
                    <div>
                        <label class="label-pro text-emerald-600">Ideal (Bom)</label>
                        <input type="number" name="estoque_ideal" value="20" class="input-pro border-emerald-100 focus:border-emerald-500 font-bold text-emerald-700">
                    </div>
                </div>
            </div>
            
            <div class="pt-4">
                <button type="submit" class="w-full btn-primary !bg-emerald-500 hover:!bg-emerald-600 !shadow-emerald-500/30 py-4 text-base">
                    <i class="fas fa-plus-circle mr-2"></i> Adicionar ao Inventário
                </button>
            </div>
        </form>
    </div>

    <a href="/historico/entrada" class="glass-panel p-4 flex justify-center items-center gap-2 text-slate-500 hover:text-slate-800 font-bold text-sm transition group">
        <i class="fas fa-history opacity-50 group-hover:opacity-100 transition"></i> Ver Histórico de Entradas
    </a>
</div>

<script>
    function verificarOutros(select) {
        const div = document.getElementById('div_outros');
        const input = document.getElementById('nome_outros');
        if (select.value === 'Outros') { 
            div.classList.remove('hidden'); 
            input.required = true; 
            input.focus(); 
        } else { 
            div.classList.add('hidden'); 
            input.required = false; 
        }
    }
</script>
{% endblock %}
