{% extends 'base.html' %}
{% block content %}
<div class="max-w-2xl mx-auto animate-fade-in">
    <div class="flex items-center justify-between mb-8">
        <div>
            <h2 class="text-3xl font-black text-slate-800 tracking-tight">Registrar Saída</h2>
            <p class="text-sm text-slate-500 font-medium mt-1">Baixa manual e entrega de EPI/Uniforme.</p>
        </div>
        <a href="{{ url_for('estoque.controle_uniforme') }}" class="btn-glass text-xs">
            <i class="fas fa-arrow-left mr-1"></i> Voltar
        </a>
    </div>

    <div class="glass-panel overflow-hidden shadow-md mb-8">
        <div class="bg-red-50/50 border-b border-red-100/50 p-6 flex items-center gap-4">
            <div class="w-12 h-12 bg-white border border-red-100 text-red-500 rounded-2xl flex items-center justify-center text-xl shadow-sm">
                <i class="fas fa-hand-holding"></i>
            </div>
            <div>
                <h3 class="font-black text-red-800 text-lg tracking-tight">Baixa de Material</h3>
                <p class="text-xs text-red-600/70 font-bold uppercase tracking-widest mt-0.5">Entrega Direta</p>
            </div>
        </div>

        <form action="/saida" method="POST" class="p-8 space-y-6 bg-white/50">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            
            <div>
                <label class="label-pro">Selecionar Item</label>
                <div class="relative">
                    <select name="item_id" class="input-pro cursor-pointer appearance-none font-bold text-slate-700" required>
                        <option value="" disabled selected>Escolha o item no inventário...</option>
                        {% for item in itens %}
                        <option value="{{ item.id }}">{{ item.nome }} - {{ item.tamanho }} ({{ item.genero }}) | Disp: {{ item.quantidade }}</option>
                        {% endfor %}
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-500"><i class="fas fa-chevron-down text-xs"></i></div>
                </div>
            </div>
            
            <div class="bg-red-50/50 p-5 rounded-2xl border border-red-100/50">
                <label class="label-pro text-red-700">Quantidade a Retirar</label>
                <input type="number" name="quantidade" min="1" value="1" class="input-pro font-black text-2xl text-red-600 border-red-200 focus:border-red-500 focus:ring-red-500 bg-white !py-4 text-center" required>
            </div>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 pt-2">
                <div>
                    <label class="label-pro">Nome do Coordenador</label>
                    <input type="text" name="coordenador" class="input-pro" placeholder="Quem autorizou?" required>
                </div>
                <div>
                    <label class="label-pro">Nome do Colaborador</label>
                    <input type="text" name="colaborador" class="input-pro" placeholder="Quem recebeu?" required>
                </div>
            </div>
            
            <div>
                <label class="label-pro">Data de Entrega</label>
                <div class="relative">
                    <i class="far fa-calendar-alt absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="date" name="data" class="input-pro pl-12 text-slate-600 font-medium" required>
                </div>
            </div>
            
            <div class="pt-6">
                <button type="submit" class="w-full btn-primary !bg-red-500 hover:!bg-red-600 !shadow-red-500/30 py-4 text-base">
                    <i class="fas fa-check mr-2"></i> Confirmar Saída
                </button>
            </div>
        </form>
    </div>

    <a href="/historico/saida" class="glass-panel p-4 flex justify-center items-center gap-2 text-slate-500 hover:text-slate-800 font-bold text-sm transition group">
        <i class="fas fa-history opacity-50 group-hover:opacity-100 transition"></i> Ver Histórico de Saídas
    </a>
</div>
{% endblock %}
